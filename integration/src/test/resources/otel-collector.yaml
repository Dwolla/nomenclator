# An OpenTelemetry Collector that accepts OTLP over gRPC and prints everything it receives, in detail, to its log.
# The tests and scripts/native-image-metadata read that log to see which spans and metrics arrived.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
