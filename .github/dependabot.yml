# Keeps the Dockerfile's pinned base-image digests and the workflows' pinned action SHAs current.
# Scala dependencies stay with Scala Steward.
version: 2
updates:
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # ci.yml is generated by sbt-typelevel, which pins these actions to major tags; a major bump here would make
    # githubWorkflowCheck fail. Their majors move with sbt-typelevel, via Scala Steward.
    ignore:
      - dependency-name: actions/checkout
        update-types: ["version-update:semver-major"]
      - dependency-name: actions/setup-java
        update-types: ["version-update:semver-major"]
      - dependency-name: sbt/setup-sbt
        update-types: ["version-update:semver-major"]
      - dependency-name: scalacenter/sbt-dependency-submission
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
