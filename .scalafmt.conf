# Pinned so a new scalafmt release can't change the output unseen.
version = 3.11.5
# Scala 3 source, including the braceless syntax that rewrite.scala3.* produces.
runner.dialect = scala3
# Long enough for the aligned parameter lists below without wrapping ordinary code.
maxColumn = 120
# sbt 1 compiles the build definition's project/*.scala with Scala 2.12, so they get the Scala 2.12 dialect, which also
# turns off the rewrite.scala3 rules below. .sbt files need nothing here: scalafmt 3.11.5 already leaves their braces
# and end markers alone.
fileOverride { "glob:**/project/*.scala" = scala212 }

# Block arguments: a multi-line block argument is braceless (`f: x =>`).
# Turns optional braces into significant indentation.
rewrite.scala3.optionalBraces.enabled = true
# Applies that to a braced last argument of any length; the check is off unless span.max is positive.
# A parenthesized argument (`f(x =>`) stays as written. RedundantBraces' oneStatApply.bracesMinSpan could turn it into
# braces, but in scalafmt 3.11.5 it also turns an argument clause that isn't the last into braces, and the result
# doesn't compile: `f(a):` followed by an indented block becomes `f { a }:`.
rewrite.scala3.optionalBraces.fewerBraces.span.max = 1000000

# Parameter lists: a later parameter list starts on its own line, aligned with the first list's opening parenthesis.
# Puts each parameter list that doesn't fit on its own line.
newlines.beforeOpenParenDefnSite = fold
# Aligns those later lists with the first one's opening parenthesis.
align.beforeOpenParenDefnSite = true
# Required by align.beforeOpenParenDefnSite.
align.closeParenSite = true
# Keeps `: Result` on the last parameter line.
newlines.sometimesBeforeColonInMethodReturnType = false
# Keeps a long result type whole, breaking the parameters instead. Without it, a signature too long for one line gets
# broken inside the type: `Resource[F, F[` / `ExitCode` / `]] =`.
newlines.avoidInResultType = true
# Keeps `extends` at the end of the last parameter line, when the source already has it there.
binPack.parentConstructors = keep
# Reflows a parameter list that has a break after `(` or `using` and before `)` (scalafmt's default), instead of
# preserving it.
newlines.configStyle.defnSite.prefer = false
# Puts one parameter per line, aligned under the `(`, in a list of 5 or more parameters spanning 60 or more characters.
# It's meant for case classes with many fields, but scalafmt can't single out case classes, so this is a size rule; the
# thresholds are a judgment call.
newlines.configStyle.defnSite.forceIfOptimized = true
runner.optimizer.defnSite { minSpan = 60, minCount = 5 }

# Scaladoc. The asterisk style and the text on the `/**` line stay at scalafmt's defaults, the style the code is
# already written in.
# Puts `*/` on its own line, even for a one-sentence comment.
docstrings.oneline = unfold
# Leaves the text's line breaks as written: no rewrapping to maxColumn, and `@param name text` stays on one line.
docstrings.wrap = keep

# Rewrites. AvoidInfix, RedundantParens, and convertToNewSyntax stay off.
# Keeps trailing commas as written, neither adding nor removing them: a trailing comma belongs only where it was written
# by hand to pre-stage a future edit. scalafmt still drops a trailing comma when the closing delimiter isn't on its own
# line.
rewrite.trailingCommas.style = keep
# Adds `end Name` after a braceless region that contains a blank line or runs 15 or more lines, following the Scala 3
# reference's "When to Use End Markers".
rewrite.scala3.endMarker.insert.blankGaps.min = 1
rewrite.scala3.endMarker.insert.breaks.min = 15
# Removes semicolons that the syntax doesn't need; a one-line `for a <- as; b <- bs yield` gets one step per line.
# Also writes a lone renamed import selector without braces, `import a.b.X as Y`. Definition and lambda bodies are left
# to the optional-braces rewrite above, so the rule needs no limits on which braces it removes.
# oneStatApply.bracesMinSpan stays unset: in scalafmt 3.11.5 it turns a non-last argument clause into braces, and the
# result doesn't compile (see the optional-braces note above).
rewrite.rules = [RemoveSemicolons, RedundantBraces]
